# Release — automatic release on every merge/push to the mainline branch.
#
# WHAT THIS DOES (read top to bottom to learn GitHub Actions):
#   1. Trigger: ANY push to `master` or `main` (i.e. every merged PR).
#      No manual tagging — the workflow versions itself.
#   2. `concurrency:` — merges landing back-to-back QUEUE instead of
#      racing (two releases must never interleave).
#   3. `version` job: read cli/Cargo.toml version → bump PATCH
#      (0.1.0 → 0.1.1) → refresh Cargo.lock → commit BOTH with `[skip ci]`
#      (that tag tells GitHub to NOT re-run any workflow for the bump
#      commit — otherwise we'd loop forever) → tag `v<new>` → push
#      commit + tag. Outputs `version`/`tag` for later jobs.
#   4. `build` job: runs once PER MATRIX LEG on its native OS (no
#      cross-compilation toolchains needed), packs
#      gitagent-<ver>-<target>.tar.gz (.zip on Windows) + SHA256SUMS.txt,
#      uploads them as artifacts.
#   5. `publish` job (`needs:` = wait for version+build): downloads
#      artifacts, creates the GitHub Release, uploads assets.
#      `installer/install-remote.sh` then installs that release via curl.
#
# LEARN BY READING: compare with ci.yml — same steps vocabulary, plus
# `strategy.matrix` (fan-out), `needs:` (ordering), `outputs:` (passing
# data between jobs), `permissions:` (what GITHUB_TOKEN may do),
# `concurrency:` (serialising runs), and `gh release` (GitHub CLI is
# preinstalled on all runners).
name: Release

on:
  push:
    branches: [main] # mainline only — feature branches never release

concurrency:
  group: auto-release
  cancel-in-progress: false # queue merges, never overlap two releases

permissions:
  contents: write # commit bump + push tag + create release + upload assets

jobs:
  version:
    name: bump version + tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install stable toolchain (for Cargo.lock refresh)
        uses: dtolnay/rust-toolchain@stable

      - name: Bump patch version, commit [skip ci], tag, push
        id: bump
        run: |
          VER="$(grep '^version' cli/Cargo.toml | head -n 1 | sed 's/.*"\(.*\)"/\1/')"
          NEW="$(echo "$VER" | awk -F. '{print $1"."$2"."$3+1}')"
          echo "bumping $VER -> $NEW"
          sed -i "s/^version = \"$VER\"$/version = \"$NEW\"/" cli/Cargo.toml
          cargo check -p cli >/dev/null # refresh Cargo.lock for the new version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cli/Cargo.toml Cargo.lock
          git commit -m "release: bump to v$NEW [skip ci]"
          git tag "v$NEW"
          BRANCH="${GITHUB_REF#refs/heads/}"
          git push origin "HEAD:$BRANCH" "v$NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: version # wait for the tag before building it
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one OS failing must not cancel the others
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest # Apple Silicon runner
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install stable toolchain + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked -p cli --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          STAGE="gitagent-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/gitagent" "$STAGE/"
          tar czf "$STAGE.tar.gz" "$STAGE"
          sha256sum "$STAGE.tar.gz" >> SHA256SUMS.txt

      - name: Package (zip, Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $stage = "gitagent-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/gitagent.exe" $stage/
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          (Get-FileHash "$stage.zip" -Algorithm SHA256).Hash.ToLower() `
            + "  $stage.zip" | Out-File -Append SHA256SUMS.txt

      - name: Upload artifacts for publish job
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: |
            gitagent-*.tar.gz
            gitagent-*.zip
            SHA256SUMS.txt

  publish:
    name: publish GitHub Release
    needs: [version, build] # wait for the tag AND every OS leg
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true

      - name: Create release + upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" \
            --title "${{ needs.version.outputs.tag }}" --generate-notes \
            gitagent-*.tar.gz gitagent-*.zip SHA256SUMS.txt
