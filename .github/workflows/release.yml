# Release — cut a release by pushing a version tag, never on plain pushes.
#
# WHAT THIS DOES (read top to bottom to learn GitHub Actions):
#   1. Trigger: a pushed tag matching `v*` (e.g. `v0.2.0`), or a manual
#      `workflow_dispatch` run from the Actions tab. Plain pushes to `main`
#      NEVER release — they only run CI. This keeps `main` bot-commit-free,
#      so `git push` is never rejected by our own automation.
#   2. `concurrency:` — two releases must never interleave; queue instead.
#   3. `resolve` job: derive `version`/`tag` from the tag name and VERIFY it
#      matches `cli/Cargo.toml` (fail fast on a typo'd tag). Manual runs
#      create + push the tag first, then follow the same path.
#   4. `build` job: runs once PER MATRIX LEG on its native OS (no
#      cross-compilation toolchains needed), packs
#      gitagent-<ver>-<target>.tar.gz (.zip on Windows) + SHA256SUMS.txt,
#      uploads them as artifacts.
#   5. `publish` job (`needs:` = wait for resolve+build): downloads
#      artifacts, creates the GitHub Release, uploads assets.
#      `installer/install-remote.sh` then installs that release via curl.
#
# DEVELOPER FLOW:
#   Push freely to `main` all day — nothing releases. When ready to ship:
#     # 1. bump the version in cli/Cargo.toml (e.g. 0.1.5 -> 0.2.0), commit, push
#     # 2. tag + push the tag — THIS is what releases:
#     git tag v0.2.0 && git push origin main v0.2.0
#
# LEARN BY READING: compare with ci.yml — same steps vocabulary, plus
# `strategy.matrix` (fan-out), `needs:` (ordering), `outputs:` (passing
# data between jobs), `permissions:` (what GITHUB_TOKEN may do),
# `concurrency:` (serialising runs), and `gh release` (GitHub CLI is
# preinstalled on all runners).
name: Release

on:
  push:
    tags: ['v*'] # version tags only — plain pushes to main never release
  workflow_dispatch: # manual "Run workflow" button in the Actions tab
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0 — must match cli/Cargo.toml)'
        required: true

concurrency:
  group: release
  cancel-in-progress: false # queue releases, never overlap two of them

permissions:
  contents: write # create tags (manual runs) + create release + upload assets

jobs:
  resolve:
    name: resolve + verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Resolve version from tag (or manual input)
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
            VER="${VER#v}" # accept "0.2.0" or "v0.2.0"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "v$VER"
            git push origin "v$VER"
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag must match cli/Cargo.toml
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          VER="${{ steps.v.outputs.version }}"
          FILE_VER="$(grep '^version' cli/Cargo.toml | head -n 1 | sed 's/.*"\(.*\)"/\1/')"
          [ "$VER" = "$FILE_VER" ] || {
            echo "tag $TAG does not match cli/Cargo.toml version $FILE_VER"
            echo "fix: bump cli/Cargo.toml to $VER, commit, retag"
            exit 1
          }
          echo "releasing $TAG (matches cli/Cargo.toml)"

  build:
    name: build (${{ matrix.target }})
    needs: resolve # wait for the version before building it
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one OS failing must not cancel the others
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest # Apple Silicon runner
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install stable toolchain + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked -p cli --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          STAGE="gitagent-${{ needs.resolve.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/gitagent" "$STAGE/"
          tar czf "$STAGE.tar.gz" "$STAGE"
          sha256sum "$STAGE.tar.gz" >> SHA256SUMS.txt

      - name: Package (zip, Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $stage = "gitagent-${{ needs.resolve.outputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/gitagent.exe" $stage/
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          (Get-FileHash "$stage.zip" -Algorithm SHA256).Hash.ToLower() `
            + "  $stage.zip" | Out-File -Append SHA256SUMS.txt

      - name: Upload artifacts for publish job
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: |
            gitagent-*.tar.gz
            gitagent-*.zip
            SHA256SUMS.txt

  publish:
    name: publish GitHub Release
    needs: [resolve, build] # wait for the version AND every OS leg
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true

      - name: Create release + upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.resolve.outputs.tag }}" \
            --title "${{ needs.resolve.outputs.tag }}" --generate-notes \
            gitagent-*.tar.gz gitagent-*.zip SHA256SUMS.txt
